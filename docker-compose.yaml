services:
  pubius-tracker:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/pubius.sqlite
      STATIC_DIRECTORY: /app/dist
      BACKUP_DIRECTORY: /backups
      COOKIE_SECURE: "true"
    volumes:
      - pubius_data:/data
      - pubius_backups:/backups
    expose:
      - "3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.pubius-tracker.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.pubius-tracker.entrypoints=websecure
      - traefik.http.routers.pubius-tracker.tls=true
      - traefik.http.routers.pubius-tracker.tls.certresolver=letsencrypt
      - traefik.http.services.pubius-tracker.loadbalancer.server.port=3000
      - traefik.http.services.pubius-tracker.loadbalancer.server.scheme=http
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 60s

volumes:
  pubius_data:
  pubius_backups:
